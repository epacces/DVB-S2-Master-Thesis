[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvbs2"
version = "1.0.0"
description = "Galois fields, BCH/LDPC codes and a DVB-S2 physical-layer simulator (companion to a 2008 MSc thesis)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Eriprando Pacces" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
fast = ["numba>=0.59"]
dev = ["pytest>=7"]
demos = ["marimo>=0.10"]

[project.scripts]
dvbs2sim = "dvbs2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dvbs2 = ["data/ldpc/*.txt", "data/ldpc/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long Monte Carlo runs (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"
